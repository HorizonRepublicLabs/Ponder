plugins {
    id "idea"
    id "eclipse"
    id "net.neoforged.moddev.legacyforge" version "${mdg_version}"
}

base {
    archivesName = "Ponder-Forge-${minecraft_version}"
}

def commonProject = findProject(":Common") != null ? project(":Common") : project(":ponder:Common")

boolean inMultiModWorkspace = rootProject.hasProperty("multiModWorkspace.enabled")
project.logger.lifecycle("MultiModWorkspace ${inMultiModWorkspace ? "enabled" : "disabled"} for project ${mod_id}:${project.name}.")

// -- Mixin Support
if (project.ext.mixin_enabled) {
    mixin {
        // Tells the mixin plugin where to put the generated refmap file.
        add(sourceSets.main, "${mod_id}.refmap.json")

        config("${mod_id}.mixins.json")
        config("${mod_id}-common.mixins.json")
    }
}

println "Java: ${System.getProperty "java.version"}, JVM: ${System.getProperty "java.vm.version"} (${System.getProperty "java.vendor"}), Arch: ${System.getProperty "os.arch"}"

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    accessTransformers.from(file('src/main/resources/META-INF/accesstransformer.cfg').absolutePath)

    parchment {
        minecraftVersion = minecraft_version
        mappingsVersion = parchment_version
    }

    runs {
        configureEach {
            systemProperty "forge.logging.console.level", "debug"
            jvmArguments = ["-XX:+IgnoreUnrecognizedVMOptions", "-XX:+AllowEnhancedClassRedefinition"]
            //jvmArgs "-XX:+UnlockCommercialFeatures" // uncomment for profiling

            systemProperty "mixin.env.remapRefMap", "true"
            systemProperty "mixin.env.refMapRemappingFile", "${projectDir}/build/createSrgToMcp/output.srg"

            if (project.ext.mixin_enabled) {
                programArgument "-mixin.config=${mod_id}.mixins.json"
            }
        }

        client {
            client()

            programArgument "-mixin.config=flywheel.backend.mixins.json"
            programArgument "-mixin.config=flywheel.impl.mixins.json"
        }

        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet commonProject.sourceSets.main
        }
    }
}

// Include resources generated by data generators.
//sourceSets.main.resources { srcDir "src/generated/resources" }

dependencies {
    compileOnly(commonProject)

    // MDG doesn't pull this in properly/automatically due to a gradle limitation
    compileOnly("org.jetbrains:annotations:26.0.1")

    modCompileOnly("dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:${flywheel_version}")
    modRuntimeOnly("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}")

    annotationProcessor("org.spongepowered:mixin:0.8.5-SNAPSHOT:processor")
}

tasks.withType(JavaCompile).configureEach {
    source(commonProject.sourceSets.main.allSource)
}
tasks.withType(Javadoc).configureEach {
    source(commonProject.sourceSets.main.allJava)
}

tasks.named("compileTestJava") {
    it.enabled = false
}

tasks.named("sourcesJar", Jar) {
    from(commonProject.sourceSets.main.allSource)
}

processResources {
    from commonProject.sourceSets.main.resources
}

jar {
    finalizedBy('reobfJar')
    manifest.attributes([
        "MixinConfigs": "${mod_id}.mixins.json"
    ])
}

// -- MAVEN PUBLISHING --
project.publishing {

    publications {

        mavenJava(MavenPublication) {

            artifactId base.archivesName.get()
            from components.java
        }
    }

    repositories {

        maven {

            // Sets maven credentials if they are provided. This is generally
            // only used for external/remote uploads.
            if (project.hasProperty("mavenUsername") && project.hasProperty("mavenPassword")) {

                credentials {

                    username findProperty("mavenUsername")
                    password findProperty("mavenPassword")
                }
            }

            url getDefaultString("mavenURL", "undefined", true)
        }
    }
}

////////////////
// IntelliJ Project Import
// The Mixin annotation process does not have an obfuscation source when running through the IntelliJ compiler,
// thus we have to prevent it from being activated as part of importing this Gradle project into IntelliJ.
if (System.getProperty("idea.sync.active") == "true") {
    afterEvaluate {
        tasks.withType(JavaCompile).all {
            it.options.annotationProcessorPath = files()
        }
    }
}
