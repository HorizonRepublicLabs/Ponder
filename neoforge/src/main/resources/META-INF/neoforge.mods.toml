modLoader = "javafml"
# The loader version doesn't matter. Modify the NeoForge and/or Minecraft version ranges instead.
loaderVersion = "[0,)"
license = "MIT"
issueTrackerURL = "https://github.com/Creators-of-Create/Ponder/issues"

[[mods]]
modId = "ponder"
version = "${version}"
displayName = "Ponder"
logoFile = "logo.png"
description = "Visual in-Game Documentation"
# these fields are mirrored in the fabric metadata
authors = "simibubi, Pepper, zelophed"
credits = "Special Thanks to IThundxr, Jozufozu, Snownee, gamez7, tterrag, Grimmauld, and TropheusJ"

[[mixins]]
config="ponder.mixins.json"

[[mixins]]
config="ponder-common.mixins.json"

[[dependencies.ponder]]
modId = "neoforge"
type="required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.ponder]]
modId = "minecraft"
type="required"
versionRange = "[${minecraft_version}]"
ordering = "NONE"
side = "BOTH"
